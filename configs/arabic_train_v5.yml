# =======================================================================
# arabic_train_v5.yml -> Fine-tune PPOCRv5 Arabic mobile rec
# =======================================================================

Global:
  debug: false
  use_gpu: true
  epoch_num: 100
  log_smooth_window: 20
  print_batch_step: 10
  save_model_dir: /home/osama/paddleocr_arabic_finetune/output/arabic_train_v5/
  save_epoch_step: 5
  eval_batch_step: [0, 500]
  cal_metric_during_train: true
  pretrained_model: /home/osama/paddleocr_arabic_finetune/output/arabic_train_v5/best_accuracy
  # checkpoints:
  checkpoints: /home/osama/paddleocr_arabic_finetune/output/arabic_train_v5/latest
  use_visualdl: false
  infer_img:
  character_dict_path: /home/osama/paddleocr_arabic_finetune/dicts/arabic_id_dict.txt
  max_text_length: &max_text_length 80
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: /home/osama/paddleocr_arabic_finetune/output/arabic_train_v5/predicts.txt
  d2s_train_image_shape: [3, 48, 320]

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.0001
    warmup_epoch: 5
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform:
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: True
          Head:
            fc_decay: 0.00001
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: *max_text_length

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: False

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /home/osama/paddleocr_arabic_finetune/data/train/
    ext_op_transform_idx: 1
    label_file_list:
      - /home/osama/paddleocr_arabic_finetune/data/train/train_label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.0
          ext_data_num: 2
          image_shape: [48, 320, 3]
          max_text_length: *max_text_length
      - RecAug:
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: true
    drop_last: true
    batch_size_per_card: 32
    num_workers: 8

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /home/osama/paddleocr_arabic_finetune/data/val/
    label_file_list:
      - /home/osama/paddleocr_arabic_finetune/data/val/val_label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          gtc_encode: NRTRLabelEncode
      - RecResizeImg:
          image_shape: [3, 48, 320]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 32
    num_workers: 4